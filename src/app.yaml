# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/interactive/interactive.v1.schema.json
title: Geo Europa
description: |
  Ein Kartenspiel für die 6. Klasse: Finde die Länder Europas auf der Karte und lerne ihre Hauptstädte kennen. Eine
  Runde hat zehn Aufgaben. Die Stufen werden Schritt für Schritt schwerer, in Stufe 1 wählst du den Namen eines
  markierten Landes. Für jedes Thema sammelst du bis zu drei Sterne: je sicherer du es weißt, desto mehr.
howto: |
  - Wähle eine Stufe und die Themen, dann starte eine Runde.
  - In Stufe 1 ist ein Land orange markiert. Tippe auf den richtigen Namen oder drücke die Taste 1 bis 4.
  - Ist die Antwort falsch, zeigt die Karte das richtige Land in Grün und dein Land in Rot.
  - Mit „Ich brauche eine Pause“ hörst du auf. Was du schon geschafft hast, bleibt auf deinem Gerät gespeichert.
  - Auf dem Handy brauchst du das Querformat. Die Karte kannst du vergrößern und mit dem Finger oder der Maus verschieben, auch nach Osten über den ersten Ausschnitt hinaus.
competencies:
  - Ich kann Europa in Teilräume gliedern und seine Staaten, Hauptstädte, Gebirge, Flüsse und Meere auf einer Karte zeigen.
languages: [de]
routes:
  - id: stufe-1
    title: Stufe 1 · Erkennen
    description: Ein Land, ein Fluss oder etwas anderes ist markiert. Welchen Namen hat es?
  - id: stufe-2
    title: Stufe 2 · Beziehungen
    description: Hauptstadt, Fluss, Nachbarland, Teil Europas. Was gehört zusammen?
  - id: stufe-3
    title: Stufe 3 · Zeigen
    description: Der Name ist gegeben. Klicke das Gesuchte auf der Karte an.
  - id: stufe-4
    title: Stufe 4 · Frei
    description: Keine Hilfe auf der Karte. Setze den Ort selbst oder tippe den Namen.
sections:
  - id: vorwissen
    title: Das solltest du schon wissen
    text: |
      Du solltest die Kontinente und Ozeane auf einer Weltkarte zeigen können. Wenn du dir dabei noch unsicher bist,
      übe das zuerst mit deinem Atlas.
  - id: karten
    title: Woher kommen die Karten?
    text: |
      Die Umrisse stammen von Natural Earth. Diese Kartendaten sind frei nutzbar. Wir haben sie vereinfacht, deshalb
      sind Küsten und Grenzen nur ungefähr genau.
