# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# Stufe 2: Fragen aus Beziehungen. Erst eine richtige Antwort (Nachbarland von Serbien), dann eine falsche (Litauen
# statt Slowakei als Nachbar der Ukraine); auch hier zeigt die Rückmeldung keinen Abstand.
seed: 11
route: stufe-2
steps:
  - inputs: [{ kind: action, name: start }]
    state: { phase: asking, level: 2, index: 0 }
    announce: "Aufgabe 1 von 10. Welches Land grenzt an das Land Serbien?"
  - inputs: [{ kind: action, name: answer, value: land-bosnien-herzegowina }]
    state: { phase: feedback, right: 1, answer: { chosen: land-bosnien-herzegowina, right: true, km: null } }
    announce: "Richtig! Bosnien und Herzegowina."
  - inputs: [{ kind: action, name: next }]
    state: { phase: asking, index: 1 }
    announce: "Aufgabe 2 von 10. Welches Land grenzt an das Land Ukraine?"
  - inputs: [{ kind: action, name: answer, value: land-litauen }]
    state:
      phase: feedback
      right: 1
      answer: { chosen: land-litauen, right: false, km: null }
      progress:
        "beziehung:grenzt-an:land-bosnien-herzegowina:land-serbien:r": [1, 0]
        "beziehung:grenzt-an:land-slowakei:land-ukraine:r": [0, 1]
    announce: "Nicht ganz. Mehrere Antworten wären richtig gewesen, sie stehen in der Liste. Deine Wahl: Litauen."
