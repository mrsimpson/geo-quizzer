ext><text x="660" y="146" font-size="30" font-weight="bold" fill="#f28c28" text-anchor="start">Paris</text><text x="660" y="172" font-size="15" font-weight="normal" fill="#444" text-anchor="start">Hauptstadt von Frankreich</text><rect x="660" y="200" width="260" height="54" rx="12" fill="#f28c28" stroke="#f28c28" stroke-width="2"/><text x="790.0" y="233.0" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Hier setzen</text><text x="660" y="290" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Fadenkreuz mit der Maus oder dem</text><text x="660" y="310" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Finger setzen; mit der Tastatur:</text><text x="660" y="330" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Pfeiltasten bewegen, Enter setzt.</text><text x="660" y="380" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Ohne Hilfe: keine Namen, keine Grenzen.</text><text x="660" y="402" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Gewertet wird der Abstand.</text><text x="20" y="530" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Skizze: Stufe 4. Nah genug (Radius je nach Größe des Elements) zählt als richtig; sonst zeigt die Linie den Abstand wie in Skizze 3.</text></svg>