th="2"/><text x="660" y="110" font-size="18" font-weight="normal" fill="#1d2b3a" text-anchor="start">Wie heißt das markierte</text><text x="660" y="134" font-size="18" font-weight="normal" fill="#1d2b3a" text-anchor="start">Land?</text><rect x="660" y="156" width="260" height="50" rx="10" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="676" y="189" font-size="20" font-weight="normal" fill="#1d2b3a" text-anchor="start">Itallien</text><text x="660" y="236" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Meintest du:</text><rect x="660" y="246" width="260" height="44" rx="12" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="790.0" y="274.0" font-size="18" font-weight="bold" fill="#1d2b3a" text-anchor="middle">Italien</text><text x="660" y="326" font-size="14" font-weight="normal" fill="#555" text-anchor="start">Kleine Tippfehler sind okay: ein Vorschlag</text><text x="660" y="346" font-size="14" font-weight="normal" fill="#555" text-anchor="start">aus den echten Namen erscheint.</text><rect x="660" y="440" width="260" height="54" rx="12" fill="#f28c28" stroke="#f28c28" stroke-width="2"/><text x="790.0" y="473.0" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Prüfen</text><text x="20" y="530" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Skizze: Stufe 4, Namen tippen. Groß/klein, Umlaute und kleine Fehler zählen nicht; die richtige Schreibweise wird danach gezeigt.</text></svg>