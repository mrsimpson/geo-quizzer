<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Arial,sans-serif"><title>Startseite</title><rect width="960" height="540" fill="#f4f1ea"/><text x="24" y="42" font-size="24" font-weight="bold" fill="#1d2b3a" text-anchor="start">Geo Europa</text><text x="24" y="64" font-size="15" font-weight="normal" fill="#444" text-anchor="start">Wähle die Themen und übe, bis du alles kannst. Du kannst jede Stufe sofort wählen.</text><rect x="24" y="90" width="216" height="150" rx="16" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="40" y="120" font-size="15" font-weight="normal" fill="#666" text-anchor="start">Stufe 1</text><text x="40" y="150" font-size="24" font-weight="bold" fill="#1d2b3a" text-anchor="start">Erkennen</text><text x="40" y="178" font-size="13" font-weight="normal" fill="#444" text-anchor="start">Markiertes Element benennen</text><text x="40" y="196" font-size="13" font-weight="normal" fill="#444" text-anchor="start"></text><text x="40" y="222" font-size="14" font-weight="bold" fill="#f28c28" text-anchor="start">112 von 133 gekonnt</text><text x="40" y="236" font-size="11" font-weight="normal" fill="#888" text-anchor="start">(Beispielzahlen)</text><rect x="256" y="90" width="216" height="150" rx="16" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="272" y="120" font-size="15" font-weight="normal" fill="#666" text-anchor="start">Stufe 2</text><text x="272" y="150" font-size="24" font-weight="bold" fill="#1d2b3a" text-anchor="start">Beziehungen</text><text x="272" y="178" font-size="13" font-weight="normal" fill="#444" text-anchor="start">Hauptstadt von, fließt durch</text><text x="272" y="196" font-size="13" font-weight="normal" fill="#444" text-anchor="start"></text><text x="272" y="222" font-size="14" font-weight="bold" fill="#f28c28" text-anchor="start">0 von 160 gekonnt</text><text x="272" y="236" font-size="11" font-weight="normal" fill="#888" text-anchor="start">(Beispielzahlen)</text><rect x="488" y="90" width="216" height="150" rx="16" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="504" y="120" font-size="15" font-weight="normal" fill="#666" text-anchor="start">Stufe 3</text><text x="504" y="150" font-size="24" font-weight="bold" fill="#1d2b3a" text-anchor="start">Zeigen</text><text x="504" y="178" font-size="13" font-weight="normal" fill="#444" text-anchor="start">Name gegeben, anklicken</text><text x="504" y="196" font-size="13" font-weight="normal" fill="#444" text-anchor="start"></text><text x="504" y="222" font-size="14" font-weight="bold" fill="#f28c28" text-anchor="start">0 von 133 gekonnt</text><text x="504" y="236" font-size="11" font-weight="normal" fill="#888" text-anchor="start">(Beispielzahlen)</text><rect x="720" y="90" width="216" height="150" rx="16" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="736" y="120" font-size="15" font-weight="normal" fill="#666" text-anchor="start">Stufe 4</text><text x="736" y="150" font-size="24" font-weight="bold" fill="#1d2b3a" text-anchor="start">Frei</text><text x="736" y="178" font-size="13" font-weight="normal" fill="#444" text-anchor="start">Ort setzen oder Namen tippen</text><text x="736" y="196" font-size="13" font-weight="normal" fill="#444" text-anchor="start"></text><text x="736" y="222" font-size="14" font-weight="bold" fill="#f28c28" text-anchor="start">0 von 133 gekonnt</text><text x="736" y="236" font-size="11" font-weight="normal" fill="#888" text-anchor="start">(Beispielzahlen)</text><text x="24" y="280" font-size="20" font-weight="bold" fill="#1d2b3a" text-anchor="start">Themen</text><rect x="24" y="296" width="118" height="44" rx="12" fill="#f28c28" stroke="#1d2b3a" stroke-width="2"/><text x="83.0" y="324.0" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Länder</text><rect x="152" y="296" width="118" height="44" rx="12" fill="#f28c28" stroke="#1d2b3a" stroke-width="2"/><text x="211.0" y="324.0" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Hauptstädte</text><rect x="280" y="296" width="118" height="44" rx="12" fill="#f28c28" stroke="#1d2b3a" stroke-width="2"/><text x="339.0" y="324.0" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Flüsse</text><rect x="408" y="296" width="118" height="44" rx="12" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="467.0" y="324.0" font-size="15" font-weight="bold" fill="#1d2b3a" text-anchor="middle">Gebirge</text><rect x="536" y="296" width="118" height="44" rx="12" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="595.0" y="324.0" font-size="15" font-weight="bold" fill="#1d2b3a" text-anchor="middle">Seen</text><rect x="664" y="296" width="118" height="44" rx="12" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="723.0" y="324.0" font-size="15" font-weight="bold" fill="#1d2b3a" text-anchor="middle">Meere</text><rect x="792" y="296" width="118" height="44" rx="12" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="851.0" y="324.0" font-size="15" font-weight="bold" fill="#1d2b3a" text-anchor="middle">Teilräume</text><text x="24" y="380" font-size="14" font-weight="normal" fill="#444" text-anchor="start">Eine Runde hat 10 Aufgaben, vor allem aus dem, was noch nicht gekonnt ist. Der Fortschritt zählt alles.</text><rect x="24" y="410" width="240" height="60" rx="12" fill="#2e9e5b" stroke="#2e9e5b" stroke-width="2"/><text x="144.0" y="446.0" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Runde starten (10 Aufgaben)</text><text x="300" y="447" font-size="14" font-weight="normal" fill="#444" text-anchor="start">Pausieren geht jederzeit. Der Lernstand bleibt auf dem Gerät.</text><text x="20" y="530" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Skizze: Startbildschirm. Auf dem Handy nur im Querformat; im Hochformat erscheint: Bitte drehe dein Gerät.</text></svg>