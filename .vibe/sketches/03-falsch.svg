<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Arial,sans-serif"><title>Rückmeldung bei falscher Antwort</title><rect width="960" height="540" fill="#f4f1ea"/><text x="24" y="42" font-size="24" font-weight="bold" fill="#1d2b3a" text-anchor="start">Stufe 3 · Zeigen</text><text x="620" y="42" font-size="16" font-weight="normal" fill="#1d2b3a" text-anchor="end">Aufgabe 4 von 10   ★☆☆   Serie 0</text><rect x="740" y="12" width="200" height="40" rx="12" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="840.0" y="38.0" font-size="14" font-weight="bold" fill="#1d2b3a" text-anchor="middle">Ich brauche eine Pause</text><rect x="20" y="70" width="600" height="440" rx="16" fill="#cfe6f2" stroke="#1d2b3a" stroke-width="2"/><polygon points="60,110 120,95 150,125 100,150" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="300,95 360,100 380,170 340,260 300,230 290,150" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="390,110 440,100 450,200 400,230" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="70,380 180,360 230,400 190,450 90,450" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="180,300 270,290 300,350 230,390 175,350" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="290,240 350,235 360,300 300,320 275,280" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="360,240 430,235 440,290 370,300" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="300,340 340,330 370,420 340,470 320,400" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="450,260 560,250 570,320 470,330" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="460,110 600,120 610,230 470,240" fill="#e7e0c9" stroke="#1d2b3a" stroke-width="2"/><polygon points="180,300 270,290 300,350 230,390 175,350" fill="#2e9e5b" fill-opacity="0.7" stroke="#1d2b3a" stroke-width="3"/><polygon points="70,380 180,360 230,400 190,450 90,450" fill="#2f6fb5" fill-opacity="0.6" stroke="#1d2b3a" stroke-width="3"/><circle cx="140" cy="410" r="7" fill="#2f6fb5"/><circle cx="235" cy="335" r="7" fill="#2e9e5b"/><line x1="140" y1="410" x2="235" y2="335" stroke="#1d2b3a" stroke-width="3" stroke-dasharray="8 6"/><rect x="130" y="350" width="130" height="30" rx="8" fill="#fff" stroke="#1d2b3a"/><text x="195" y="371" font-size="16" font-weight="bold" fill="#1d2b3a" text-anchor="middle">≈ 900 km</text><rect x="640" y="70" width="300" height="440" rx="16" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="660" y="108" font-size="22" font-weight="bold" fill="#2f6fb5" text-anchor="start">Nicht ganz.</text><text x="660" y="140" font-size="16" font-weight="normal" fill="#1d2b3a" text-anchor="start">Du hast Spanien angeklickt.</text><text x="660" y="164" font-size="16" font-weight="normal" fill="#1d2b3a" text-anchor="start">Gesucht war Frankreich (grün).</text><text x="660" y="205" font-size="16" font-weight="bold" fill="#1d2b3a" text-anchor="start">Wusstest du?</text><text x="660" y="228" font-size="15" font-weight="normal" fill="#1d2b3a" text-anchor="start">[Platzhalter: ein kurzer, geprüfter</text><text x="660" y="248" font-size="15" font-weight="normal" fill="#1d2b3a" text-anchor="start">Fakt für Kinder]</text><text x="660" y="290" font-size="15" font-weight="normal" fill="#1d2b3a" text-anchor="start">Hauptstadt: Paris, an der Seine.</text><rect x="660" y="320" width="260" height="44" rx="12" fill="#fff" stroke="#1d2b3a" stroke-width="2"/><text x="790.0" y="348.0" font-size="15" font-weight="bold" fill="#1d2b3a" text-anchor="middle">Mehr lesen im Klexikon ↗</text><rect x="660" y="440" width="260" height="54" rx="12" fill="#2e9e5b" stroke="#2e9e5b" stroke-width="2"/><text x="790.0" y="473.0" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Weiter</text><text x="20" y="530" font-size="13" font-weight="normal" fill="#555" text-anchor="start">Skizze: Rückmeldung. Gewählter Ort (blau), richtiger Ort (grün), gestrichelte Linie mit Entfernung. Der Link lädt erst nach Klick.</text></svg>